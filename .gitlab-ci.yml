# gitlab.com/nomograph/kebnf .gitlab-ci.yml
#
# Pipeline structure provided by nomograph/pipeline grammar-rust@v4.1.8
# (gates + Rust CLI bundle + grammar-validate stage with tree-sitter
# generation check and ANTLR4 compile + parse check).

default:
  tags: [storr]

include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - component: gitlab.com/nomograph/pipeline/grammar-rust@v5.2.1
    inputs:
      binary_name: kebnf
      project_description: "Convert OMG KeBNF grammars to ANTLR4 and tree-sitter."
      crates_publish: true
      in_kit_registry: false
      kebnf_inputs: "tests/kebnf/KerML-textual-bnf.kebnf tests/kebnf/SysML-textual-bnf.kebnf"
  # Fail-closed automerge gate (renovate-architecture L1 verdict
  # contract): osv-verdict -> CHECK_OSV, cargo-verdict -> CHECK_CARGO
  # (builds+tests the crate), automerge-gate blocks unless every
  # required check is PRESENT and ==pass. The gate job's green/red is
  # the pipeline status Renovate reads before GitLab native auto-merge.
  - component: gitlab.com/nomograph/pipeline/osv-verdict@v5.3.0
    inputs:
      stage: verdict
  - component: gitlab.com/nomograph/pipeline/cargo-verdict@v5.3.0
    inputs:
      stage: verdict
  - component: gitlab.com/nomograph/pipeline/automerge-gate@v5.3.0
    inputs:
      stage: gate
      required-checks: "osv,cargo"

stages: [lint, test, validate, build, sign, publish, release, notify, verdict, gate]
