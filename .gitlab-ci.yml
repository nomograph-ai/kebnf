# gitlab.com/nomograph/kebnf .gitlab-ci.yml
#
# Pipeline structure provided by nomograph/pipeline grammar-rust@v4.1.8
# (gates + Rust CLI bundle + grammar-validate stage with tree-sitter
# generation check and ANTLR4 compile + parse check).

default:
  tags: [storr]

include:
  - component: gitlab.com/nomograph/pipeline/grammar-rust@v5.10.0
    inputs:
      binary_name: kebnf
      project_description: "Convert OMG KeBNF grammars to ANTLR4 and tree-sitter."
      crates_publish: true
      in_kit_registry: false
      kebnf_inputs: "tests/kebnf/KerML-textual-bnf.kebnf tests/kebnf/SysML-textual-bnf.kebnf"
  # Fail-closed automerge gate (renovate-architecture L1 verdict
  # contract): osv-verdict -> CHECK_OSV, cargo-verdict -> CHECK_CARGO
  # (builds+tests the crate), secret-verdict -> CHECK_SECRET,
  # automerge-gate blocks unless every required check is PRESENT and
  # ==pass. The gate job's green/red is the pipeline status Renovate
  # reads before GitLab native auto-merge.
  - component: gitlab.com/nomograph/pipeline/osv-verdict@v5.10.0
    inputs:
      stage: verdict
  - component: gitlab.com/nomograph/pipeline/cargo-verdict@v5.10.0
    inputs:
      stage: verdict
  # Secret detection that BLOCKS. Replaces (does not supplement)
  # Jobs/Secret-Detection.gitlab-ci.yml: that template's analyzer shells
  # out to gitleaks with --exit-code 0, so the job exits 0 while holding
  # findings, and it ships allow_failure: true besides -- a leak could
  # never redden this pipeline. secret-verdict runs the SAME analyzer
  # image and the same curated ruleset, then parses
  # gl-secret-detection-report.json and exits nonzero when the
  # vulnerabilities array is non-empty. Identical scan surface, real
  # verdict; a missing report fails closed.
  - component: gitlab.com/nomograph/pipeline/secret-verdict@v5.10.0
    inputs:
      stage: verdict
  # v5.10.0 for the secret_job needs: slot -- the v5.7.0 gate has no
  # such slot, so CHECK_SECRET would never reach it and a required
  # "secret" would fail closed forever.
  - component: gitlab.com/nomograph/pipeline/automerge-gate@v5.10.0
    inputs:
      stage: gate
      required-checks: "osv,cargo,secret"

stages: [lint, test, validate, build, sign, publish, release, notify, verdict, gate]
