<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Outer fill -->
  <rect x="0" y="0" width="256" height="256" fill="#faf6ed" rx="0"/>
  <!-- Inset frame -->
  <rect x="20" y="20" width="216" height="216" fill="none" stroke="#2c2417" stroke-width="4" rx="0"/>
  <!-- Header bar -->
  <rect x="28" y="28" width="200" height="36" fill="#2c2417" rx="0"/>
  <text x="128" y="53" text-anchor="middle" font-size="20" fill="#faf6ed" font-weight="bold" font-family="'Courier New', monospace">kebnf</text>

  <!-- Schematic: Funnel shape  -  one input splitting into two outputs -->
  <!-- Input box at top -->
  <rect x="88" y="82" width="80" height="30" fill="none" stroke="#2c2417" stroke-width="2" rx="0"/>
  <text x="128" y="102" text-anchor="middle" font-size="9" fill="#2c2417" font-family="'Courier New', monospace" font-weight="bold">KeBNF</text>

  <!-- Funnel lines from input down to center point -->
  <line x1="108" y1="112" x2="120" y2="140" stroke="#2c2417" stroke-width="1.5"/>
  <line x1="148" y1="112" x2="136" y2="140" stroke="#2c2417" stroke-width="1.5"/>

  <!-- Center converter node -->
  <rect x="108" y="140" width="40" height="24" fill="#2c2417" rx="0"/>
  <text x="128" y="157" text-anchor="middle" font-size="8" fill="#faf6ed" font-family="'Courier New', monospace" font-weight="bold">conv</text>

  <!-- Split lines from center to two outputs -->
  <line x1="118" y1="164" x2="80" y2="184" stroke="#2c2417" stroke-width="1.5"/>
  <polygon points="76,181 80,190 85,182" fill="#2c2417"/>

  <line x1="138" y1="164" x2="176" y2="184" stroke="#2c2417" stroke-width="1.5"/>
  <polygon points="171,182 176,190 180,181" fill="#2c2417"/>

  <!-- Output 1: ANTLR4 -->
  <rect x="48" y="190" width="70" height="26" fill="none" stroke="#2c2417" stroke-width="2" rx="0"/>
  <text x="83" y="208" text-anchor="middle" font-size="9" fill="#2c2417" font-family="'Courier New', monospace" font-weight="bold">ANTLR4</text>

  <!-- Output 2: tree-sitter -->
  <rect x="138" y="190" width="70" height="26" fill="none" stroke="#2c2417" stroke-width="2" rx="0"/>
  <text x="173" y="208" text-anchor="middle" font-size="8" fill="#2c2417" font-family="'Courier New', monospace" font-weight="bold">ts .js</text>

  <!-- Base line -->
  <line x1="60" y1="228" x2="196" y2="228" stroke="#c4b99a" stroke-width="2"/>
</svg>
