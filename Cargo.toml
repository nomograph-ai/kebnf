[package]
name = "nomograph-kebnf"
version = "0.3.0"
edition = "2024"
description = "Convert OMG KeBNF grammars to ANTLR4 and tree-sitter -- parses all 640 KerML + SysML v2 rules"
license = "MIT"
repository = "https://gitlab.com/nomograph/kebnf"
homepage = "https://nomograph.ai"
authors = ["Andrew Dunn <andunn@gitlab.com>"]
keywords = ["sysml", "kebnf", "grammar", "parser", "antlr4"]
categories = ["development-tools", "parsing"]
readme = "README.md"
exclude = ["tests/", "scripts/", "prompts/", "docs/", "*.png", "*.svg"]

[[bin]]
name = "kebnf"
path = "src/main.rs"

[dependencies]
ariadne = "0.4"
chumsky = "1.0.0-alpha.7"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.12", features = ["blocking"] }
directories = "5"

[dev-dependencies]
insta = { version = "1", features = ["json"] }
pretty_assertions = "1"
